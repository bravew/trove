name: trove-design
version: "1.0.0"
description: "Designer skills: Figma review, accessibility, design systems"
author:
  name: Trove Contributors
homepage: https://github.com/bravew/trove
license: MIT
keywords: [design, figma, accessibility, design-system]
category: design

roles: [design]

skills:
  - path: ./skills/trove-design-review
    platforms: [claude, cursor, codex, agents]

  - path: ./skills/trove-a11y
    platforms: [claude, cursor, codex, agents]
    auto_attach:
      globs: ["**/*.tsx", "**/*.jsx", "**/*.vue", "**/*.html"]

  - path: ./skills/trove-component-spec
    platforms: [claude, cursor, codex, agents]

  - path: ./skills/trove-visual-parity
    platforms: [claude, cursor, codex, agents]

mcp_servers:
  # Figma — design integration (Streamable HTTP + OAuth, no env vars)
  figma:
    type: http
    url: https://mcp.figma.com/mcp
    optional: true
    description: "Figma design integration via OAuth. Read designs, generate code, Code Connect mappings."
    tools:
      - get_design_context
      - get_screenshot
      - get_metadata
      - search_design_system
      - generate_diagram

platforms:
  claude:
    strict: true
  cursor:
    rules_dir: ./rules/
  codex:
    apps: []
