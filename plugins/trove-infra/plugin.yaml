name: trove-infra
description: "Infrastructure and DevOps automation"
author:
  name: Trove Contributors
homepage: https://github.com/bravew/trove
license: MIT
keywords: [infrastructure, aws, terraform, cdk, docker, devops]
category: servers-cloud
logo: assets/logo.svg
brandColor: "#0F766E"

roles: [devops]

skills:
  - path: ./skills/trove-terraform
    platforms: [claude, cursor, codex, agents, gemini, copilot]
    auto_attach:
      globs: ["**/*.tf", "**/*.tfvars"]
    category: servers-cloud

  - path: ./skills/trove-cdk
    platforms: [claude, cursor, codex, agents, gemini, copilot]
    auto_attach:
      globs: ["**/cdk.json", "**/cdk/**/*.ts"]
    category: servers-cloud

  - path: ./skills/trove-docker
    platforms: [claude, cursor, codex, agents, gemini, copilot]
    auto_attach:
      globs: ["**/Dockerfile*", "**/docker-compose*.yml"]
    category: servers-cloud


platforms:
  claude:
    strict: true
  cursor:
    rules_dir: ./rules/
  codex:
    apps: []
