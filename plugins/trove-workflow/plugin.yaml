  # Design-discipline principles — surfaced by description and benefits-from,
  # cited by using-trove. Adapted from the spudex/pstack principle set.
  - path: ./skills/trove-principle-laziness
    platforms: [claude, cursor, codex, agents, opencode, gemini]

  - path: ./skills/trove-principle-data-shape
    platforms: [claude, cursor, codex, agents, opencode, gemini]

  - path: ./skills/trove-principle-type-discipline
    platforms: [claude, cursor, codex, agents, opencode, gemini]

  - path: ./skills/trove-principle-migrate-then-delete
    platforms: [claude, cursor, codex, agents, opencode, gemini]

  - path: ./skills/trove-principle-idempotency
    platforms: [claude, cursor, codex, agents, opencode, gemini]

  - path: ./skills/trove-principle-encode-in-structure
    platforms: [claude, cursor, codex, agents, opencode, gemini]

hooks:
  SessionStart:
    - matcher: "startup|clear|compact"
      command: "${PLUGIN_ROOT}/hooks/session-start.sh"
      description: "Inject using-trove discipline anchor"

bootstrap:
  sessionStart: true

platforms:
  claude:
    strict: true
  cursor:
    rules_dir: ./rules/
  codex:
    apps: []
