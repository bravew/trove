name: Skill quality check

on:
  pull_request:
    branches: [main, canary, stable]

permissions:
  contents: read

jobs:
  changed-skill-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.12.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci
        name: Install pinned dependencies

      - run: npm install -g @github/copilot@1.0.69
        name: Install pinned Copilot CLI

      - name: Analyze changed skills
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha }}
          QUALITY_HEAD_REF: ${{ github.sha }}
        run: |
          bun run quality:report:changed -- \
            --base="$QUALITY_BASE_REF" \
            --head="$QUALITY_HEAD_REF" \
            --with-install \
            --output="$RUNNER_TEMP/quality-report.v1.json" \
            --markdown="$RUNNER_TEMP/quality-report.md"

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/quality-report.md" ]]; then
            cat "$RUNNER_TEMP/quality-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Quality analysis did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changed-skill-quality-report
          path: |
            ${{ runner.temp }}/quality-report.v1.json
            ${{ runner.temp }}/quality-report.md
          if-no-files-found: error
          retention-days: 90
