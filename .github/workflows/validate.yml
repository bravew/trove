name: Validate

on:
  pull_request:
    branches: [main, canary, stable]
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci
        name: Install dependencies (frozen lockfile)

      - run: npm install -g @github/copilot@1.0.69
        name: Install pinned Copilot CLI

      - run: |
          bun run build:skills -- --dry-run
          bun run build:plugins -- --dry-run
          bun run build:marketplace -- --dry-run
          bun run build:routing -- --dry-run
          bun run build:deps -- --dry-run
        name: Check generated artifact freshness before build

      - run: bun run eval:structure:changed -- --base="$EVAL_BASE_REF" --head="$EVAL_HEAD_REF"
        if: github.event_name == 'pull_request'
        name: Check changed-skill eval structure
        env:
          EVAL_BASE_REF: ${{ github.event.pull_request.base.sha }}
          EVAL_HEAD_REF: ${{ github.sha }}

      - run: bun run eval:structure
        if: github.event_name == 'push'
        name: Check all eval structure

      - run: bun run build
        name: Build all stages

      - run: bun run validate
        name: Validate marketplace structure

      - run: bun test tests
        name: Projection + workflow + delegation tests

      - run: bun run test:acceptance:artifacts
        name: Bootstrap acceptance artifact checks

      - run: tests/acceptance/setup-links.sh
        name: Installer link layout in a disposable HOME

      - run: bun run test:acceptance:copilot
        name: Isolated native Copilot marketplace smoke

      - run: npm install -g @anthropic-ai/claude-code
        name: Install Claude Code for strict manifest validation

      - run: bun run validate:claude-manifests
        name: claude plugin validate --strict (all plugins + marketplace)

      - run: bun run eval:changed
        if: github.event_name == 'pull_request'
        name: Changed-skill model evaluation (reports skipped without API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_BASE_REF: ${{ github.event.pull_request.base.sha }}
          EVAL_HEAD_REF: ${{ github.sha }}

  eval-gate:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci

      - run: bun run build

      - run: bun run eval:gate
        name: Quality gate evaluation

  # Advisory only. The blocking Agent Skills gate is scripts/lib/agent-skills-spec.ts,
  # written in-repo from the published spec. The reference implementation declares
  # itself demonstration-only and the same-named npm package publishes no repository
  # link, so it is a second opinion, never an authority (see the plan's F14). A
  # disagreement is a signal to re-read the spec, not an automatic failure.
  skills-ref-crosscheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci

      - run: bun run build

      - run: scripts/crosscheck-skills-ref.sh
        name: Advisory skills-ref cross-check

  skill-triggering:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci

      - run: bun run build

      - run: tests/skill-triggering/run.sh
        name: Skill-triggering smoke tests

  copilot-latest-canary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci

      - run: npm install -g @github/copilot@latest
        name: Install latest Copilot CLI

      - run: bun run test:acceptance:copilot
        name: Detect Copilot CLI drift
        env:
          COPILOT_EXPECTED_VERSION: latest
