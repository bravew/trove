name: Validate

on:
  pull_request:
    branches: [main, canary, stable]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install
        name: Install dependencies

      - run: bun run build
        name: Build all stages

      - run: bun run validate
        name: Validate marketplace structure

      - run: bun run build:skills -- --dry-run
        name: Check skill freshness

      - run: bun run build:routing -- --dry-run
        name: Check routing index freshness

      - run: bun run build:deps -- --dry-run
        name: Check dependency artifact freshness

      - run: bun test
        name: Projection + workflow + delegation tests

      - run: bun run test:acceptance:artifacts
        name: Bootstrap acceptance artifact checks

      - run: bun run eval:changed
        name: Changed-skill evals (structure-only without API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  eval-gate:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build

      - run: bun run eval:gate
        name: Quality gate evaluation

  skill-triggering:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build

      - run: tests/skill-triggering/run.sh
        name: Skill-triggering smoke tests
