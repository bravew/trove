name: Catalog advisory

# Advisory maintenance. Deterministic, non-blocking, and separate from the
# required gates: it reports skill overlap and staleness so a maintainer knows
# where to look, and never fails a pull request.

on:
  schedule:
    - cron: "37 9 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci
        name: Install pinned dependencies

      - name: Report catalog overlap and staleness
        run: |
          bun run advisory:catalog -- \
            --output="$RUNNER_TEMP/catalog-advisory.v1.json" \
            --markdown="$RUNNER_TEMP/catalog-advisory.md"
          cat "$RUNNER_TEMP/catalog-advisory.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report upstream vendor drift
        run: |
          bun run sync:upstream -- --check \
            --json "$RUNNER_TEMP/upstream-report.json" \
            --markdown "$RUNNER_TEMP/upstream-report.md"
          cat "$RUNNER_TEMP/upstream-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload advisory reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-advisory
          path: |
            ${{ runner.temp }}/catalog-advisory.v1.json
            ${{ runner.temp }}/catalog-advisory.md
            ${{ runner.temp }}/upstream-report.json
            ${{ runner.temp }}/upstream-report.md
          if-no-files-found: warn
          retention-days: 90
