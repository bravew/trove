name: External plugin gate

# Unprivileged analyzer. It reads pull-request content, including content from
# forks, so it holds no secrets and no write permission. Its only output is a
# bounded JSON artifact that the writer workflow re-validates before acting.

on:
  pull_request:
    paths:
      - external/**
      - scripts/external-plugin-*.ts
      - scripts/lib/external-plugin.ts

permissions:
  contents: read

jobs:
  external-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci
        name: Install pinned dependencies

      - run: npm install -g @github/copilot@1.0.69
        name: Install pinned Copilot CLI

      - name: Analyze external plugin records
        id: analyze
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          bun run scripts/external-plugin-gate.ts \
            --with-clone \
            --with-install \
            --output="$RUNNER_TEMP/external-analysis.v1.json"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 75 is EX_TEMPFAIL: our runner or the network failed, not the
          # submitted plugin. It must not read as a request for changes.
          if [[ $code -eq 75 ]]; then
            echo "::warning::External gate hit an infrastructure failure; rerun required." 
            exit 0
          fi
          exit $code

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-plugin-analysis
          path: ${{ runner.temp }}/external-analysis.v1.json
          if-no-files-found: warn
          retention-days: 30
