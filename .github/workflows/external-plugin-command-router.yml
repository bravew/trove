name: External plugin command router

# Maintainer commands: `/external <approve|needs-changes|reject|keep|remove> <record>`.
#
# The router never checks out or executes pull-request content. It applies the
# transition to the record on the default branch and opens a pull request, so
# every approval, rejection, re-review, and removal is an auditable commit
# rather than a hidden state change.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  route:
    if: startsWith(github.event.comment.body, '/external ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require write access
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          level="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission')"
          case "$level" in
            admin|write|maintain) echo "actor $ACTOR has $level" ;;
            *) echo "::error::$ACTOR does not have write access; command ignored"; exit 1 ;;
          esac

      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci
        name: Install pinned dependencies

      - name: Parse the command
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          read -r _ command record _ <<< "$COMMENT_BODY"
          case "$command" in
            approve|needs-changes|reject|keep|remove) ;;
            *) echo "::error::unknown command '$command'"; exit 1 ;;
          esac
          # The record name is a path segment: reject anything but kebab-case.
          if [[ ! "$record" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::invalid record name '$record'"
            exit 1
          fi
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "record=$record" >> "$GITHUB_OUTPUT"

      - name: Apply the transition
        env:
          COMMAND: ${{ steps.parse.outputs.command }}
          RECORD: ${{ steps.parse.outputs.record }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          bun run scripts/external-plugin-review.ts \
            --command="$COMMAND" \
            --record="$RECORD" \
            --actor="$ACTOR"

      - name: Open the transition pull request
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ steps.parse.outputs.command }}
          RECORD: ${{ steps.parse.outputs.record }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          if git diff --quiet; then
            echo "record already in the requested state; nothing to open"
            exit 0
          fi
          branch="chore/external-${RECORD}-${COMMAND}"
          git config user.name "trove-external-bot"
          git config user.email "trove-external-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add "external/plugins/$RECORD.yaml"
          git commit -m "chore(external): $COMMAND $RECORD"
          git push --force-with-lease -u origin "$branch"
          if [[ -z $(gh pr list --head "$branch" --state open --json number --jq '.[0].number') ]]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "chore(external): $COMMAND $RECORD" \
              --body "Requested by @$ACTOR in ${{ github.event.comment.html_url }}."
          fi
