name: External plugin intake

# Validates a submitted record from an issue body. Unprivileged: the issue body
# is untrusted text, so the job holds no secrets and writes nothing. The result
# is a job summary and an artifact; a record enters the repository only through
# a reviewed pull request.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read

jobs:
  validate-submission:
    if: contains(github.event.issue.labels.*.name, 'external-plugin')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci
        name: Install pinned dependencies

      - name: Write issue body to a file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue-body.md"

      - name: Validate the submitted record
        run: |
          set +e
          bun run scripts/external-plugin-intake.ts \
            --body-file="$RUNNER_TEMP/issue-body.md" \
            --output="$RUNNER_TEMP/external-intake.v1.json" \
            --markdown="$RUNNER_TEMP/external-intake.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/external-intake.md" >> "$GITHUB_STEP_SUMMARY"
          [[ $code -eq 75 ]] && exit 0
          exit $code

      - name: Upload intake result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-plugin-intake
          path: |
            ${{ runner.temp }}/external-intake.v1.json
            ${{ runner.temp }}/external-intake.md
          if-no-files-found: warn
          retention-days: 30
