name: Catalog quality report

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  catalog-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci
        name: Install pinned dependencies

      - run: npm install -g @github/copilot@1.0.69
        name: Install pinned Copilot CLI

      - name: Download previous comparable report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          previous_run="$(gh run list \
            --workflow skill-quality-report.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -n "$previous_run" ]]; then
            gh run download "$previous_run" \
              --name catalog-quality-report \
              --dir "$RUNNER_TEMP/previous" || true
          fi

      - name: Analyze full catalog
        run: |
          previous=()
          if [[ -f "$RUNNER_TEMP/previous/quality-report.v1.json" ]]; then
            previous+=("--previous=$RUNNER_TEMP/previous/quality-report.v1.json")
          fi
          bun run quality:report -- \
            --with-install \
            --output="$RUNNER_TEMP/quality-report.v1.json" \
            --markdown="$RUNNER_TEMP/quality-report.md" \
            "${previous[@]}"

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/quality-report.md" ]]; then
            cat "$RUNNER_TEMP/quality-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Quality analysis did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-quality-report
          path: |
            ${{ runner.temp }}/quality-report.v1.json
            ${{ runner.temp }}/quality-report.md
          if-no-files-found: error
          retention-days: 90
