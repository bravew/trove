name: External plugin gate writer

# Privileged writer. It runs after the unprivileged analyzer, checks out
# trusted default-branch code, and never checks out or executes pull-request
# content. The analyzer artifact is untrusted input: scripts/external-plugin-writer.ts
# re-derives the pull request state from the API and refuses to write on any
# mismatch.

on:
  workflow_run:
    workflows: ["External plugin gate"]
    types: [completed]

permissions:
  contents: read

jobs:
  write-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun ci
        name: Install pinned dependencies

      - name: Record producing run metadata
        env:
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          jq -n \
            --arg workflowPath "$WORKFLOW_PATH" \
            --arg event "$RUN_EVENT" \
            --arg conclusion "$RUN_CONCLUSION" \
            --arg headSha "$RUN_HEAD_SHA" \
            --arg headRepository "$RUN_HEAD_REPOSITORY" \
            '{workflowPath: $workflowPath, event: $event, conclusion: $conclusion, headSha: $headSha, headRepository: $headRepository}' \
            > "$RUNNER_TEMP/run.json"

      - name: Download analyzer artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/analysis"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name external-plugin-analysis \
            --dir "$RUNNER_TEMP/analysis"

      - name: Validate provenance and update the comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run scripts/external-plugin-writer.ts \
            --artifact="$RUNNER_TEMP/analysis/external-analysis.v1.json" \
            --run="$RUNNER_TEMP/run.json" \
            --repository="$GITHUB_REPOSITORY"
