      - id: trove-pulse
        upstream_path: skills/last30days
        local_path: skills/research/trove-pulse
        base_sha: 7869eb17144789b843e6655c41bd3d570aa2288a
        base_tree_digest: sha256:5baa08ad22048554bfdc0eaabd7d91892a36d23e7c6ae5d371786564e11427f1
        local_tree_digest: sha256:0f14a33efc639c00f8b088464a52d34e6fdaa0edfd4c9e3e11d2ec86a8efe45f
        patch_digest: sha256:6b3dc7c01dc97e362cd7136e15d70f51275229138171157aa7c8d8e9c43d0ff5
        checked_sha: 7869eb17144789b843e6655c41bd3d570aa2288a
        checked_at: "2026-11-10T02:50:38Z"
        candidate_sha: null
        imported_at: "2026-11-10T02:50:38Z"
        include:
          - SKILL.md
          - references/**
          - scripts/**
        exclude:
          - scripts/build-skill.sh
          - scripts/compare.sh
          - scripts/test-v1-vs-v2.sh
          - scripts/setup-pass.sh
          - scripts/setup-keychain.sh
          - scripts/evaluate_search_quality.py
          - scripts/test_device_auth.py
          - scripts/verify_v3.py
          - scripts/lib/agentcookie.py
          - scripts/lib/chrome_cdp.py
          - scripts/box_chrome_login.py
        path_map:
          SKILL.md: references/runtime-spec.md
        local_only:
          - SKILL.md.tmpl
        transforms:
          # Only the backtick-quoted invocation form, one entry per file that
          # contains it. The bare token also matches repository URLs, config
          # paths, and script names, so a wider pattern would corrupt them.
          - {kind: replace-literal, path: references/agent-mode.md, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 1}
          # Status lines the model is told to print verbatim.
          - {kind: replace-literal, path: references/research-runbook.md, from: "/last30days - ", to: "/trove-research:trove-pulse - ", minimum_occurrences: 2}
          # A suggested follow-up the model is told to offer the user.
          - {kind: replace-literal, path: references/comparison.md, from: "with /last30days ", to: "with /trove-research:trove-pulse ", minimum_occurrences: 1}
          - {kind: replace-literal, path: references/discovery.md, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 3}
          - {kind: replace-literal, path: references/followups.md, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 3}
          - {kind: replace-literal, path: references/hiring-signals.md, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 1}
          - {kind: replace-literal, path: references/library-queue.md, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 1}
          - {kind: replace-literal, path: references/runtime.md, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 1}
          - {kind: replace-literal, path: references/save-html-brief.md, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 2}
          - {kind: replace-literal, path: references/setup-wizard.md, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 2}
          - {kind: replace-literal, path: references/synthesis.md, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 1}
          - {kind: replace-literal, path: scripts/lib/doctor.py, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 1}
          - {kind: replace-literal, path: scripts/lib/reddit_arctic.py, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 1}
          - {kind: replace-literal, path: scripts/lib/render.py, from: "`/last30days", to: "`/trove-research:trove-pulse", minimum_occurrences: 1}
        # Spec is 229 KB today and the selection is ~2.5 MB; both grow weekly.
        # Raising the globals would weaken the guard for the Vercel artifacts.
        policy:
          maximum_file_bytes: 524288
          maximum_artifact_bytes: 8388608
        patches:
          - upstream-patches/trove-pulse/local.patch
        status: active
