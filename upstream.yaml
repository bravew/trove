not_vendored:
  # Selected by allowlist, so these are omissions by decision, not accident.
  # `agent-tooling` is upstream's own `.claude/` and AGENTS.md surface, and
  # `mcp` needs a path rewrite before it can ship (plan §5.5).
  trove-ffmpeg:
    - agent-tooling
    - assets
    - bin
    - demos
    - docs
    - evals
    - examples
    - mcp
    - tests
  # `example-gallery` is assets/example-*.html plus assets/index.html, about
  # 4.4 MB of rendered samples. It exceeds maximum_artifact_bytes; the Trove
  # front tells the agent to start from the templates and type references.
  diagram-design:
    - example-gallery
  awesome-copilot:
    # Reviewed and declined for the pilot. github-actions-hardening declares no
    # `license:` in its SKILL.md frontmatter at the pinned revision, and this
    # manifest verifies per-skill frontmatter evidence, so vendoring it would
    # mean weakening the license check. Revisit if upstream adds the field.
    - github-actions-hardening
    - quality-playbook
    - agentic-eval
    - security-review
    - suggest-awesome-github-copilot-skills
    - copilot-usage-metrics
  vercel-agent-skills:
    - composition-patterns
    - deploy-to-vercel
    - vercel-cli-with-tokens
    - vercel-optimize
    - web-design-guidelines
    - writing-guidelines
  last30days-skill:
    - mcp
    - tests
    - assets
    - agents
    - grok-plugin
    - translated-readmes
    # New browser-cookie and CDP lanes added after v3.21.1, excluded by decision
    # (plan D2). cookie_paths.py stays: the three cookie modules that already
    # shipped import it. reddit_rss.py was deleted upstream and nothing imports it.
    - browser-cookie-cdp
  last30days-skill-cn:
    - assets
    - tests
    # Binary hot-board decoration; policy sets allow_binary false.
    - hot-board-cat
    - fixtures
    - hooks
    - agents
    - root-development-copies
